<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#17518f">
<title>Présence — École Ousmane Sidibé</title>
<style>
  :root{ --blue:#17518f; --gold:#c8901a; --green:#1e8e3e; --red:#d33; --muted:#6b7280; --border:#e2e5ea; --bg:#f6f8f7; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:#1a1a1a}
  .header{background:var(--blue);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
  .header h1{font-size:16px;margin:0}
  .header p{font-size:11.5px;margin:2px 0 0;opacity:.85}
  .header button{background:rgba(255,255,255,.15);color:#fff;border:none;padding:7px 12px;border-radius:6px;font-size:12px;cursor:pointer}
  .wrap{max-width:520px;margin:0 auto;padding:16px}
  .login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .login-box{background:#fff;border-radius:12px;padding:28px 24px;max-width:340px;width:100%;box-shadow:0 4px 20px rgba(0,0,0,.08);text-align:center}
  .login-box h2{margin:0 0 4px;font-size:17px;color:var(--blue)}
  .login-box p{margin:0 0 18px;font-size:12.5px;color:var(--muted)}
  .login-box input{width:100%;padding:11px 12px;border-radius:7px;border:1px solid var(--border);font-size:14px;margin-bottom:12px}
  .login-box button{width:100%;padding:11px;border-radius:7px;border:none;background:var(--blue);color:#fff;font-weight:600;font-size:14px;cursor:pointer}
  .err{color:var(--red);font-size:12px;margin-bottom:8px;display:none}
  .form-box{background:#fff;border-radius:10px;padding:16px;margin-bottom:14px;border:1px solid var(--border)}
  .sec-title{font-weight:700;font-size:14px;color:var(--blue);margin-bottom:10px}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
  select,input[type=date],input[type=text]{width:100%;padding:9px 10px;border-radius:7px;border:1px solid var(--border);font-size:13.5px;margin-bottom:12px;font-family:inherit;background:#fff}
  .btn-green{width:100%;padding:12px;border-radius:8px;border:none;background:var(--green);color:#fff;font-weight:700;font-size:14px;cursor:pointer}
  .checkbox-row{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:14px;cursor:pointer}
  .checkbox-row input{width:16px;height:16px;cursor:pointer;margin:0}
  .liste-jour{margin-top:6px}
  .item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
  .item:last-child{border-bottom:none}
  .badge{font-size:11px;padding:3px 8px;border-radius:20px;font-weight:600}
  .badge.absence{background:#fde8e8;color:var(--red)}
  .badge.retard{background:#fff3d6;color:var(--gold)}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:14px 0}
  .hidden{display:none !important}
</style>
</head>
<body>

<!-- ÉCRAN DE CONNEXION -->
<div class="login-screen" id="login-screen">
  <div class="login-box">
    <h2>🏫 Présence</h2>
    <p>École Privée Ousmane Sidibé<br>Accès réservé aux enseignants</p>
    <div class="err" id="login-err">Mot de passe incorrect.</div>
    <input type="password" id="mdp-input" placeholder="Mot de passe" onkeydown="if(event.key==='Enter') seConnecter()">
    <button onclick="seConnecter()">Se connecter</button>
  </div>
</div>

<!-- PAGE PRINCIPALE -->
<div id="app" class="hidden">
  <div class="header">
    <div>
      <h1>École Ousmane Sidibé</h1>
      <p>Présence — accès enseignant</p>
    </div>
    <button onclick="seDeconnecter()">🔓 Quitter</button>
  </div>

  <div class="wrap">
    <div class="form-box">
      <div class="sec-title">Enregistrer une absence / un retard</div>
      <label>Élève</label>
      <select id="p-eleve" onchange="majMatiere()"></select>

      <label>Type</label>
      <select id="p-type">
        <option value="absence">Absence</option>
        <option value="retard">Retard</option>
      </select>

      <label>Matière</label>
      <select id="p-matiere"></select>

      <label>Date</label>
      <input type="date" id="p-date">

      <label>Justifié ?</label>
      <select id="p-justifie">
        <option value="non">Non justifié</option>
        <option value="oui">Justifié</option>
      </select>

      <label>Remarque (optionnel)</label>
      <input type="text" id="p-remarque" placeholder="Ex: Maladie, retard transport...">

      <label class="checkbox-row">
        <input type="checkbox" id="p-auto-whatsapp" checked>
        📲 Envoyer automatiquement une notification WhatsApp au parent
      </label>

      <button class="btn-green" onclick="ajouterPresence()">+ Enregistrer</button>
    </div>

    <div class="form-box">
      <div class="sec-title">Enregistrées aujourd'hui</div>
      <div id="liste-jour" class="liste-jour"><div class="empty">Chargement...</div></div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { initializeFirestore, persistentLocalCache, persistentSingleTabManager, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// ⚠️ Mot de passe de cette page (différent du mot de passe admin). Change-le ici si besoin.
const MOT_DE_PASSE_PRESENCE = "presence2026";
// Numéro qui reçoit une notification à chaque absence/retard enregistré (le directeur)
const NUMERO_DIRECTEUR = "76339219";

const firebaseConfig = {
  apiKey: "AIzaSyD3mfTWWngbrXc4FyE8MNJvYF7YTEQ29EU",
  authDomain: "gestion-ecole-ousmane-sidibe.firebaseapp.com",
  projectId: "gestion-ecole-ousmane-sidibe",
  storageBucket: "gestion-ecole-ousmane-sidibe.firebasestorage.app",
  messagingSenderId: "311153375215",
  appId: "1:311153375215:web:363ff448118e2fdd8ca81a"
};
const app = initializeApp(firebaseConfig);
const db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentSingleTabManager() }) });
const ECOLE_ID = "ecole-ousmane-sidibe";

async function charger(cle, defaut){
  try{
    const ref = doc(db, "ecoles", ECOLE_ID, "data", cle);
    const snap = await getDoc(ref);
    return snap.exists() ? snap.data().valeur : defaut;
  }catch(e){ console.error(e); return defaut; }
}
async function sauvegarderCle(cle, valeur){
  try{
    const ref = doc(db, "ecoles", ECOLE_ID, "data", cle);
    await setDoc(ref, { valeur });
  }catch(e){ console.error(e); alert("⚠️ Erreur de sauvegarde. Vérifiez votre connexion internet."); }
}

let eleves = [];
let presences = [];

const nomNiveaux = {
  petit:'Petite section',moyen:'Moyenne section',grand:'Grande section',
  '1ere':'1ère année','2eme':'2ème année','3eme':'3ème année',
  '4eme':'4ème année','5eme':'5ème année','6eme':'6ème année',
  '7eme':'7ème année','8eme':'8ème année','9eme':'9ème année (DEF)',
  '10eme':'10ème année (CG)','11sci':'11ème Sciences','11let':'11ème Lettres','11ses':'11ème SES',
  tsexp:'Terminale TSExp',tse:'Terminale TSE',tseco:'Terminale TSeco',tss:'Terminale TSS',tll:'Terminale TLL',tall:'Terminale TALL'
};
const MATIERES = {
  _primaire: ['Français','Mathématiques','Anglais','Histoire-Géographie','Sciences (SVT)','Physique-Chimie','Éducation Civique et Morale','Éducation Physique et Sportive','Dictée-Question'],
  _college:  ['Rédaction','Dictée-Question','Mathématiques','Physique-Chimie','Anglais','Sciences Nat','Histoire-Géographie','Éducation Civique et Morale','Éducation Physique','Musique','Dessin','Enseignement Ménager','Lecture','Récitation','Conduite'],
  '10eme':   ['Mathématiques','Physique-Chimie','Sciences (SVT)','Anglais','Économie','Arts (Dramatique ou Musique)','Histoire-Géographie','Français'],
  '11sci':   ['Mathématiques','Physique-Chimie','Sciences (SVT)','Anglais','Éducation Civique et Morale','Éducation Physique et Sportive','Histoire-Géographie','Français'],
  '11let':   ['Mathématiques','Anglais','Philosophie','Arts (Dramatique ou Musique)','Éducation Civique et Morale','Éducation Physique et Sportive','Histoire','Géographie','Français'],
  '11ses':   ['Philosophie','Mathématiques','Anglais','Histoire','Géographie','Éducation Civique et Morale','Éducation Physique et Sportive','Comptabilité','Économie','Maths fine / Maths général'],
  tse:       ['Mathématiques','Physique','Chimie','Philosophie','Sciences (SVT)','Anglais'],
  tsexp:     ['Mathématiques','Physique-Chimie','Philosophie','Biologie','Anglais','Géologie'],
  tseco:     ['Économie','Comptabilité','Géographie','Anglais','Philosophie','Maths fine / Maths général'],
  tss:       ['Sociologie','Philosophie','Mathématiques','Anglais','Histoire','Géographie'],
  tll:       ['Anglais','Littérature','Linguistique','Philosophie','Mathématiques','Français'],
  tall:      ['Mathématiques','Anglais','Philosophie','Arts (Dramatique ou Musique)','Histoire-Géographie','Français'],
};
function getMatieresNiveau(niv){
  if(MATIERES[niv]) return MATIERES[niv];
  if(['7eme','8eme','9eme'].includes(niv)) return MATIERES['_college'];
  return MATIERES['_primaire'];
}
function dateAuj(){ return new Date().toLocaleDateString('fr-FR'); }
function numeroWhatsApp(tel){
  let t = (tel||'').replace(/[\s+]/g,'');
  if(t && !t.startsWith('223')) t = '223'+t;
  return t;
}

window.seConnecter = function(){
  const val = document.getElementById('mdp-input').value;
  if(val === MOT_DE_PASSE_PRESENCE){
    sessionStorage.setItem('connecte_presence','oui');
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    demarrer();
  } else {
    document.getElementById('login-err').style.display = 'block';
  }
};
window.seDeconnecter = function(){
  sessionStorage.removeItem('connecte_presence');
  location.reload();
};

window.majMatiere = function(){
  const sel = document.getElementById('p-eleve');
  const e = eleves.find(x=>x.id===parseInt(sel.value));
  const matSel = document.getElementById('p-matiere');
  if(!e){ matSel.innerHTML=''; return; }
  matSel.innerHTML = [...getMatieresNiveau(e.niveau), 'Toute la journée'].map(m=>`<option>${m}</option>`).join('');
};

function renderListeJour(){
  const cont = document.getElementById('liste-jour');
  const aujourdhui = dateAuj();
  const duJour = presences.filter(p=>p.date===aujourdhui).sort((a,b)=>b.id-a.id);
  if(!duJour.length){ cont.innerHTML = '<div class="empty">Aucune absence/retard enregistré aujourd\'hui.</div>'; return; }
  cont.innerHTML = duJour.map(p=>{
    const e = eleves.find(x=>x.id===p.eleveId);
    const nom = e ? `${e.prenom} ${e.nom}` : 'Élève inconnu';
    return `<div class="item">
      <div>${nom}<br><span style="font-size:11px;color:var(--muted)">${p.matiere}</span></div>
      <span class="badge ${p.type}">${p.type==='absence'?'Absence':'Retard'}</span>
    </div>`;
  }).join('');
}

window.ajouterPresence = async function(){
  const eleveId = parseInt(document.getElementById('p-eleve').value);
  if(!eleveId){ alert("Aucun élève disponible. Contactez la direction."); return; }
  const type = document.getElementById('p-type').value;
  const matiere = document.getElementById('p-matiere').value;
  const dateInp = document.getElementById('p-date').value;
  const justifie = document.getElementById('p-justifie').value;
  const remarque = document.getElementById('p-remarque').value.trim();
  const envoiAuto = document.getElementById('p-auto-whatsapp').checked;
  const date = dateInp ? new Date(dateInp).toLocaleDateString('fr-FR') : dateAuj();

  const nouvellePresence = { id: Date.now(), eleveId, type, matiere, date, justifie, remarque };
  presences.push(nouvellePresence);
  await sauvegarderCle('presences', presences);
  document.getElementById('p-remarque').value = '';
  renderListeJour();

  const e = eleves.find(x=>x.id===eleveId);
  if(envoiAuto){
    const tel = numeroWhatsApp(e.tel);
    if(!tel || tel.replace('223','').length<8){
      alert(`✅ ${type==='absence'?'Absence':'Retard'} enregistré(e) pour ${e.prenom} ${e.nom}.\n\n⚠️ Notification WhatsApp non envoyée : aucun numéro de téléphone valide pour ce parent.`);
    } else {
      let msg = `${type==='absence'?'❌ *Absence*':'⏰ *Retard*'} — École Ousmane Sidibé\n\n`;
      msg += `Cher(e) parent de *${e.prenom} ${e.nom}*,\n\n`;
      msg += `Nous vous informons ${type==='absence'?"de l'absence":'du retard'} de votre enfant :\n`;
      msg += `📅 Date : ${date}\n📘 Matière : ${matiere}\n`;
      msg += `${justifie==='oui'?'✅ Justifié':'⚠️ Non justifié'}\n`;
      if(remarque) msg += `📝 Remarque : ${remarque}\n`;
      msg += `\n🏫 École Privée Ousmane Sidibé — N'tonasso, Koutiala`;
      window.open(`https://wa.me/${tel}?text=${encodeURIComponent(msg)}`, '_blank');
    }
  } else {
    alert(`✅ ${type==='absence'?'Absence':'Retard'} enregistré(e) pour ${e.prenom} ${e.nom}`);
  }

  // Notification au directeur, à chaque absence/retard enregistré (indépendant de la case parent ci-dessus)
  if(NUMERO_DIRECTEUR){
    let msgDir = `🔔 *Notification — École Ousmane Sidibé*\n\n`;
    msgDir += `${type==='absence'?'❌ Absence':'⏰ Retard'} enregistré(e) pour *${e.prenom} ${e.nom}* (${nomNiveaux[e.niveau]||e.niveau})\n`;
    msgDir += `📅 Date : ${date}\n📘 Matière : ${matiere}\n`;
    msgDir += `${justifie==='oui'?'✅ Justifié':'⚠️ Non justifié'}\n`;
    if(remarque) msgDir += `📝 Remarque : ${remarque}\n`;
    msgDir += `\n📲 Saisi via la page Présence enseignant`;
    const telDir = numeroWhatsApp(NUMERO_DIRECTEUR);
    const fenetreDir = window.open(`https://wa.me/${telDir}?text=${encodeURIComponent(msgDir)}`, '_blank');
    if(!fenetreDir){
      // Le navigateur a bloqué l'ouverture d'une seconde fenêtre : on prévient l'utilisateur
      setTimeout(()=>{
        if(confirm("La notification au directeur a été bloquée par le navigateur (limite de fenêtres popup). Voulez-vous l'ouvrir maintenant ?")){
          window.open(`https://wa.me/${telDir}?text=${encodeURIComponent(msgDir)}`, '_blank');
        }
      }, 300);
    }
  }
};

async function demarrer(){
  document.getElementById('app').style.opacity='0.5';
  eleves = await charger('eleves', []);
  presences = await charger('presences', []);
  document.getElementById('app').style.opacity='1';

  const selEleve = document.getElementById('p-eleve');
  selEleve.innerHTML = eleves
    .slice()
    .sort((a,b)=> (nomNiveaux[a.niveau]||'').localeCompare(nomNiveaux[b.niveau]||'') || a.nom.localeCompare(b.nom))
    .map(e=>`<option value="${e.id}">${e.prenom} ${e.nom} — ${nomNiveaux[e.niveau]||e.niveau}</option>`).join('');
  window.majMatiere();
  document.getElementById('p-date').value = new Date().toISOString().split('T')[0];
  renderListeJour();
}

window.addEventListener('load', ()=>{
  if(sessionStorage.getItem('connecte_presence')==='oui'){
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    demarrer();
  }
});
</script>
</body>
</html>
